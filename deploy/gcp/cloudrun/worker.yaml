# Cloud Run Job definition — ingestion-worker (staging)
# Deploy: gcloud run jobs replace deploy/gcp/cloudrun/worker.yaml --region=asia-southeast1
# Execute: gcloud run jobs execute audit-worker-staging --region=asia-southeast1
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: audit-worker-staging
  labels:
    app: ingestion-worker
    env: staging
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          containers:
            - image: REGION-docker.pkg.dev/PROJECT/audit-containers/ingestion-worker:latest
              resources:
                limits:
                  cpu: "2"
                  memory: 4Gi
              env:
                - name: LOG_LEVEL
                  value: INFO
                - name: LOG_FORMAT
                  value: json
                - name: RABBITMQ_URL
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: audit-rabbitmq-url-staging
                - name: NEO4J_URI
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: audit-neo4j-uri-staging
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: audit-mongo-uri-staging
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: audit-s3-endpoint-staging
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: audit-openai-key
          maxRetries: 3
          timeoutSeconds: 3600
          serviceAccountName: audit-worker-sa@YOUR_PROJECT.iam.gserviceaccount.com
