# Default values for audit-assistant-api

replicaCount: 3

image:
  repository: audit-assistant-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: api.audit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  NODE_ENV: production
  LOG_FORMAT: json
  PORT: "8000"
  RAG_ENGINE_URL: http://audit-rag-engine:8001

secretRefs:
  - name: DATABASE_URL
    secretName: audit-api-secrets
    secretKey: database-url
  - name: REDIS_URL
    secretName: audit-api-secrets
    secretKey: redis-url
  - name: JWT_SECRET
    secretName: audit-api-secrets
    secretKey: jwt-secret
  - name: OPENAI_API_KEY
    secretName: audit-shared-secrets
    secretKey: openai-api-key

probes:
  startup:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 12
  liveness:
    path: /health
    port: 8000
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    path: /health
    port: 8000
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

podAntiAffinity:
  enabled: true
  type: soft

serviceAccount:
  create: true
  name: audit-api-sa
  annotations: {}

networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: audit-assistant-ui
        - podSelector:
            matchLabels:
              app: nginx-ingress
      ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: audit-rag-engine
      ports:
        - port: 8001
