# ============================================================
# EKS — Production Helm value overrides
# Usage:
#   helm upgrade --install audit-api ./deploy/helm/audit-assistant-api \
#     -f ./deploy/helm/overrides/eks-production.yaml -n audit-prod
# ============================================================

# ---------- audit-assistant-api ----------
audit-assistant-api:
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/audit-assistant-api
    tag: "${IMAGE_TAG}"
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:123456789012:certificate/xxxxxxxx
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/healthcheck-path: /health
      alb.ingress.kubernetes.io/group.name: audit-prod
    hosts:
      - host: api.audit.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: audit-api-tls
        hosts:
          - api.audit.example.com
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  serviceAccount:
    create: true
    name: audit-api-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/audit-api-role
  env:
    NODE_ENV: production
    RAG_ENGINE_URL: http://audit-rag-engine:8100
    LOG_LEVEL: info
    LOG_FORMAT: json

# ---------- audit-rag-engine ----------
audit-rag-engine:
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/audit-rag-engine
    tag: "${IMAGE_TAG}"
  service:
    type: ClusterIP
    port: 8100
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  serviceAccount:
    create: true
    name: audit-rag-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/audit-rag-role
  env:
    LOG_LEVEL: INFO
    LOG_FORMAT: json
    ENTITY_EXTRACTION_ENABLED: "true"

# ---------- audit-assistant-ui ----------
audit-assistant-ui:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/audit-assistant-ui
    tag: "${IMAGE_TAG}"
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:123456789012:certificate/xxxxxxxx
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/healthcheck-path: /
      alb.ingress.kubernetes.io/group.name: audit-prod
    hosts:
      - host: audit.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: audit-ui-tls
        hosts:
          - audit.example.com
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    name: audit-ui-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/audit-ui-role
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: https://api.audit.example.com

# ---------- ingestion-worker ----------
ingestion-worker:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/ingestion-worker
    tag: "${IMAGE_TAG}"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    name: audit-worker-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/audit-worker-role
  env:
    LOG_LEVEL: INFO
    LOG_FORMAT: json
